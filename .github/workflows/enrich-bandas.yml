name: Enriquecer Bandas y Frecuencias RF (Incremental)

on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
    inputs:
      max_band_seconds:
        description: 'Segundos máximos dedicados a consultar detalleEstacion.do (respetando 1.0 s/req)'
        required: false
        type: string
        default: '18000'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-update-and-deploy'
  cancel-in-progress: false

jobs:
  enrich-bands:
    name: Extraer Bandas Pendientes (detalleEstacion.do · 1s/req)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      updated: ${{ steps.commit_changes.outputs.updated }}
      pending_before: ${{ steps.check_pending.outputs.pending }}
    steps:
      - name: Descargar repositorio (rama main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Comprobar antenas pendientes sin bandas en public/data/antenas.json
        id: check_pending
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("public/data/antenas.json", "r", encoding="utf-8") as fh:
              dataset = json.load(fh)
          antenas = dataset.get("antenas", [])
          pending = sum(1 for rec in antenas if not isinstance(rec.get("bandas"), list))
          print(f"Total antenas: {len(antenas)} | Pendientes sin bandas: {pending}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"pending={pending}\n")
          PY

      - name: Enriquecer lote incremental de bandas y frecuencias (1.0 s entre peticiones)
        if: steps.check_pending.outputs.pending != '0'
        run: |
          python3 scripts/fetch_antenas.py \
            --enrich-bands-only \
            --input public/data/antenas.json \
            --output public/data/antenas.json \
            --delay 1.0 \
            --max-band-seconds ${{ inputs.max_band_seconds || '18000' }}

      - name: Confirmar y publicar lote enriquecido en main
        id: commit_changes
        if: steps.check_pending.outputs.pending != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/data/antenas.json; then
            git add public/data/antenas.json
            git commit -m "chore(data): enriquecer bandas y frecuencias de antenas (lote incremental)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "No se detectaron cambios en public/data/antenas.json"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    name: Compilar Aplicación y Publicar en GitHub Pages
    needs: [enrich-bands]
    if: needs.enrich-bands.result == 'success' && needs.enrich-bands.outputs.updated == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar último estado de main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Ejecutar pruebas automatizadas (Crawler Python + Frontend Vitest)
        run: |
          python3 -m unittest scripts/test_fetch_antenas.py
          npm test

      - name: Compilar bundle de producción (TypeScript + Vite)
        run: npm run build

      - name: Copiar respaldo 404.html para alojamiento estático
        run: cp dist/index.html dist/404.html

      - name: Configurar entorno GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
