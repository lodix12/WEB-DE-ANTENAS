name: Actualizar Censo Infoantenas y Desplegar en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Escanear antenas y frecuencias en MINETUR (escaneo forzado manual)'
        required: false
        type: boolean
        default: true
      record_novedades:
        description: 'Contabilizar este escaneo en la sección Novedades (desactivar para escaneo forzado base)'
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  check-trigger:
    name: Evaluar Modo de Escaneo Manual (Forzado)
    runs-on: ubuntu-latest
    outputs:
      should_scan: ${{ steps.decide.outputs.should_scan }}
      record_novedades: ${{ steps.decide.outputs.record_novedades }}
      scan_id: ${{ steps.decide.outputs.scan_id }}
      scan_started_at: ${{ steps.decide.outputs.scan_started_at }}
      scan_trigger: ${{ steps.decide.outputs.scan_trigger }}
    steps:
      - name: Determinar parámetros de ejecución
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REFRESH_DATA: ${{ inputs.refresh_data }}
          INPUT_RECORD_NOVEDADES: ${{ inputs.record_novedades }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SCAN_STARTED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          SHOULD_SCAN="false"
          RECORD_NOVEDADES="false"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_REFRESH_DATA" = "false" ]; then
              SHOULD_SCAN="false"
            else
              SHOULD_SCAN="true"
            fi
            if [ "$INPUT_RECORD_NOVEDADES" = "false" ]; then
              RECORD_NOVEDADES="false"
            else
              RECORD_NOVEDADES="true"
            fi
          fi

          echo "should_scan=$SHOULD_SCAN" | tee -a "$GITHUB_OUTPUT"
          echo "record_novedades=$RECORD_NOVEDADES" | tee -a "$GITHUB_OUTPUT"
          echo "scan_id=$RUN_ID" | tee -a "$GITHUB_OUTPUT"
          echo "scan_started_at=$SCAN_STARTED_AT" | tee -a "$GITHUB_OUTPUT"
          echo "scan_trigger=$EVENT_NAME" | tee -a "$GITHUB_OUTPUT"

  scan-part-1:
    name: Escaneo Nacional MINETUR (Parte 1/2 · Censo + Bandas Keep-Alive)
    needs: [check-trigger]
    if: needs.check-trigger.outputs.should_scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: 'infoantenas-crawl-worker'
      cancel-in-progress: false
    outputs:
      has_more: ${{ steps.check_remaining.outputs.has_more }}
    steps:
      - name: Descargar repositorio (rama main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recolectar censo nacional y bandas RF en paralelo Keep-Alive con stream en vivo
        env:
          SCAN_ID: ${{ needs.check-trigger.outputs.scan_id }}
          SCAN_STARTED_AT: ${{ needs.check-trigger.outputs.scan_started_at }}
          SCAN_TRIGGER: ${{ needs.check-trigger.outputs.scan_trigger }}
          RECORD_NOVEDADES: ${{ needs.check-trigger.outputs.record_novedades }}
        run: |
          mkdir -p /tmp/scan-live
          python3 scripts/publish_scan_status.py \
            --status-file /tmp/scan-live/scan-status.json \
            --live-dir /tmp/scan-live \
            --mode watch \
            --interval 15 \
            --scan-id "$SCAN_ID" \
            --scan-trigger "$SCAN_TRIGGER" \
            --record-novedades "$RECORD_NOVEDADES" \
            --part "1/2" \
            --started-at "$SCAN_STARTED_AT" \
            --antenas-file public/data/antenas.json &
          WATCH_PID=$!
          trap 'kill "$WATCH_PID" 2>/dev/null || true; wait "$WATCH_PID" 2>/dev/null || true' EXIT

          EXTRA_ARGS=()
          if [ "$RECORD_NOVEDADES" = "false" ]; then
            EXTRA_ARGS+=(--skip-novedades)
          fi
          python3 scripts/fetch_antenas.py \
            --output public/data/antenas.json \
            --delay 0.02 \
            --workers 16 \
            --max-band-rps 75 \
            --census-workers 8 \
            --preserve-from public/data/antenas.json \
            --fetch-bands \
            --max-band-seconds 18000 \
            --rescan-since "$SCAN_STARTED_AT" \
            --novedades-output public/data/novedades.json \
            --novedades-mode append \
            --eliminaciones-output public/data/eliminaciones.json \
            --eliminaciones-mode append \
            --unico-output public/data/unico-5g.json \
            --scan-id "$SCAN_ID" \
            --status-output /tmp/scan-live/scan-status.json \
            --live-dir /tmp/scan-live \
            --live-mode reset \
            --scan-trigger "$SCAN_TRIGGER" \
            --scan-part "1/2" \
            "${EXTRA_ARGS[@]}"

          kill "$WATCH_PID" 2>/dev/null || true
          wait "$WATCH_PID" 2>/dev/null || true

      - name: Confirmar y publicar avance sin conflictos (Parte 1/2)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/scan-commit-backup
          cp -f public/data/antenas.json /tmp/scan-commit-backup/antenas.json
          if [ -f public/data/novedades.json ]; then
            cp -f public/data/novedades.json /tmp/scan-commit-backup/novedades.json
          fi
          if [ -f public/data/eliminaciones.json ]; then
            cp -f public/data/eliminaciones.json /tmp/scan-commit-backup/eliminaciones.json
          fi

          PUSHED="false"
          for ATTEMPT in 1 2 3; do
            git checkout -- public/data/antenas.json public/data/novedades.json public/data/eliminaciones.json public/data/unico-5g.json 2>/dev/null || true
            git fetch --depth=1 origin main
            git reset --hard origin/main
            cp -f /tmp/scan-commit-backup/antenas.json public/data/antenas.json
            if [ -f /tmp/scan-commit-backup/novedades.json ]; then
              python3 scripts/fetch_antenas.py \
                --merge-novedades-from /tmp/scan-commit-backup/novedades.json \
                --novedades-output public/data/novedades.json
            fi
            if [ -f /tmp/scan-commit-backup/eliminaciones.json ]; then
              python3 scripts/fetch_antenas.py \
                --merge-eliminaciones-from /tmp/scan-commit-backup/eliminaciones.json \
                --eliminaciones-output public/data/eliminaciones.json
            fi
            if [ -f public/data/unico-5g.json ]; then
              python3 scripts/build_unico_5g.py \
                --sync-antenas public/data/antenas.json \
                --unico-file public/data/unico-5g.json
            fi
            git add public/data/antenas.json public/data/novedades.json public/data/eliminaciones.json public/data/unico-5g.json
            if git diff --cached --quiet; then
              echo "Sin cambios en public/data/antenas.json, public/data/novedades.json, public/data/eliminaciones.json ni public/data/unico-5g.json"
              PUSHED="true"
              break
            fi
            git commit -m "chore(data): escaneo forzado Infoantenas (parte 1/2)"
            if git push origin HEAD:main; then
              PUSHED="true"
              break
            fi
            echo "Reintentando push hacia main (intento $ATTEMPT/3)..."
            sleep 2
          done
          if [ "$PUSHED" != "true" ]; then
            echo "Error: no fue posible publicar los cambios de Parte 1/2 tras 3 intentos." >&2
            exit 1
          fi

      - name: Comprobar estaciones pendientes de escaneo de bandas
        id: check_remaining
        env:
          SCAN_STARTED_AT: ${{ needs.check-trigger.outputs.scan_started_at }}
        run: |
          python3 - <<'PY'
          import json, os
          started = os.environ["SCAN_STARTED_AT"]
          with open("public/data/antenas.json", encoding="utf-8") as fh:
              data = json.load(fh)
          remaining = sum(
              1
              for a in data.get("antenas", [])
              if not isinstance(a.get("bandas"), list)
              or not isinstance(a.get("concesiones"), list)
              or not a.get("bandsScannedAt")
              or str(a.get("bandsScannedAt")) < started
          )
          has_more = "true" if remaining > 0 else "false"
          print(f"Estaciones pendientes tras Parte 1/2 (desde {started}): {remaining} -> has_more={has_more}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"has_more={has_more}\n")
          PY

      - name: Actualizar estado en vivo tras Parte 1/2
        if: always()
        env:
          SCAN_ID: ${{ needs.check-trigger.outputs.scan_id }}
          SCAN_STARTED_AT: ${{ needs.check-trigger.outputs.scan_started_at }}
          SCAN_TRIGGER: ${{ needs.check-trigger.outputs.scan_trigger }}
          RECORD_NOVEDADES: ${{ needs.check-trigger.outputs.record_novedades }}
          JOB_STATUS: ${{ job.status }}
          HAS_MORE: ${{ steps.check_remaining.outputs.has_more }}
        run: |
          python3 scripts/publish_scan_status.py \
            --status-file /tmp/scan-live/scan-status.json \
            --live-dir /tmp/scan-live \
            --mode finalize \
            --scan-id "$SCAN_ID" \
            --scan-trigger "$SCAN_TRIGGER" \
            --record-novedades "$RECORD_NOVEDADES" \
            --part "1/2" \
            --started-at "$SCAN_STARTED_AT" \
            --antenas-file public/data/antenas.json \
            --job-status "$JOB_STATUS" \
            --has-more "${HAS_MORE:-false}"

  scan-part-2:
    name: Escaneo Nacional MINETUR (Parte 2/2 · Continuación Bandas RF)
    needs: [check-trigger, scan-part-1]
    if: needs.scan-part-1.result == 'success' && needs.scan-part-1.outputs.has_more == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: 'infoantenas-crawl-worker'
      cancel-in-progress: false
    outputs:
      has_more: ${{ steps.check_remaining.outputs.has_more }}
    steps:
      - name: Descargar repositorio (rama main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restaurar flujo en vivo y completar bandas pendientes (Parte 2/2)
        env:
          SCAN_ID: ${{ needs.check-trigger.outputs.scan_id }}
          SCAN_STARTED_AT: ${{ needs.check-trigger.outputs.scan_started_at }}
          SCAN_TRIGGER: ${{ needs.check-trigger.outputs.scan_trigger }}
          RECORD_NOVEDADES: ${{ needs.check-trigger.outputs.record_novedades }}
        run: |
          mkdir -p /tmp/scan-live
          python3 scripts/publish_scan_status.py \
            --status-file /tmp/scan-live/scan-status.json \
            --live-dir /tmp/scan-live \
            --mode restore \
            --scan-id "$SCAN_ID"

          python3 scripts/publish_scan_status.py \
            --status-file /tmp/scan-live/scan-status.json \
            --live-dir /tmp/scan-live \
            --mode watch \
            --interval 15 \
            --scan-id "$SCAN_ID" \
            --scan-trigger "$SCAN_TRIGGER" \
            --record-novedades "$RECORD_NOVEDADES" \
            --part "2/2" \
            --started-at "$SCAN_STARTED_AT" \
            --antenas-file public/data/antenas.json &
          WATCH_PID=$!
          trap 'kill "$WATCH_PID" 2>/dev/null || true; wait "$WATCH_PID" 2>/dev/null || true' EXIT

          EXTRA_ARGS=()
          if [ "$RECORD_NOVEDADES" = "false" ]; then
            EXTRA_ARGS+=(--skip-novedades)
          fi
          python3 scripts/fetch_antenas.py \
            --enrich-bands-only \
            --input public/data/antenas.json \
            --output public/data/antenas.json \
            --delay 0.02 \
            --workers 16 \
            --max-band-rps 75 \
            --max-band-seconds 18000 \
            --rescan-since "$SCAN_STARTED_AT" \
            --novedades-output public/data/novedades.json \
            --novedades-mode append \
            --eliminaciones-output public/data/eliminaciones.json \
            --eliminaciones-mode append \
            --unico-output public/data/unico-5g.json \
            --scan-id "$SCAN_ID" \
            --status-output /tmp/scan-live/scan-status.json \
            --live-dir /tmp/scan-live \
            --live-mode append \
            --scan-trigger "$SCAN_TRIGGER" \
            --scan-part "2/2" \
            "${EXTRA_ARGS[@]}"

          kill "$WATCH_PID" 2>/dev/null || true
          wait "$WATCH_PID" 2>/dev/null || true

      - name: Confirmar y publicar avance sin conflictos (Parte 2/2)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/scan-commit-backup
          cp -f public/data/antenas.json /tmp/scan-commit-backup/antenas.json
          if [ -f public/data/novedades.json ]; then
            cp -f public/data/novedades.json /tmp/scan-commit-backup/novedades.json
          fi
          if [ -f public/data/eliminaciones.json ]; then
            cp -f public/data/eliminaciones.json /tmp/scan-commit-backup/eliminaciones.json
          fi

          PUSHED="false"
          for ATTEMPT in 1 2 3; do
            git checkout -- public/data/antenas.json public/data/novedades.json public/data/eliminaciones.json public/data/unico-5g.json 2>/dev/null || true
            git fetch --depth=1 origin main
            git reset --hard origin/main
            cp -f /tmp/scan-commit-backup/antenas.json public/data/antenas.json
            if [ -f /tmp/scan-commit-backup/novedades.json ]; then
              python3 scripts/fetch_antenas.py \
                --merge-novedades-from /tmp/scan-commit-backup/novedades.json \
                --novedades-output public/data/novedades.json
            fi
            if [ -f /tmp/scan-commit-backup/eliminaciones.json ]; then
              python3 scripts/fetch_antenas.py \
                --merge-eliminaciones-from /tmp/scan-commit-backup/eliminaciones.json \
                --eliminaciones-output public/data/eliminaciones.json
            fi
            if [ -f public/data/unico-5g.json ]; then
              python3 scripts/build_unico_5g.py \
                --sync-antenas public/data/antenas.json \
                --unico-file public/data/unico-5g.json
            fi
            git add public/data/antenas.json public/data/novedades.json public/data/eliminaciones.json public/data/unico-5g.json
            if git diff --cached --quiet; then
              echo "Sin cambios en public/data/antenas.json, public/data/novedades.json, public/data/eliminaciones.json ni public/data/unico-5g.json"
              PUSHED="true"
              break
            fi
            git commit -m "chore(data): escaneo forzado Infoantenas (parte 2/2)"
            if git push origin HEAD:main; then
              PUSHED="true"
              break
            fi
            echo "Reintentando push hacia main (intento $ATTEMPT/3)..."
            sleep 2
          done
          if [ "$PUSHED" != "true" ]; then
            echo "Error: no fue posible publicar los cambios de Parte 2/2 tras 3 intentos." >&2
            exit 1
          fi

      - name: Comprobar estaciones pendientes de escaneo de bandas
        id: check_remaining
        env:
          SCAN_STARTED_AT: ${{ needs.check-trigger.outputs.scan_started_at }}
        run: |
          python3 - <<'PY'
          import json, os
          started = os.environ["SCAN_STARTED_AT"]
          with open("public/data/antenas.json", encoding="utf-8") as fh:
              data = json.load(fh)
          remaining = sum(
              1
              for a in data.get("antenas", [])
              if not isinstance(a.get("bandas"), list)
              or not isinstance(a.get("concesiones"), list)
              or not a.get("bandsScannedAt")
              or str(a.get("bandsScannedAt")) < started
          )
          has_more = "true" if remaining > 0 else "false"
          print(f"Estaciones pendientes tras Parte 2/2 (desde {started}): {remaining} -> has_more={has_more}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"has_more={has_more}\n")
          PY

      - name: Actualizar estado en vivo tras Parte 2/2
        if: always()
        env:
          SCAN_ID: ${{ needs.check-trigger.outputs.scan_id }}
          SCAN_STARTED_AT: ${{ needs.check-trigger.outputs.scan_started_at }}
          SCAN_TRIGGER: ${{ needs.check-trigger.outputs.scan_trigger }}
          RECORD_NOVEDADES: ${{ needs.check-trigger.outputs.record_novedades }}
          JOB_STATUS: ${{ job.status }}
          HAS_MORE: ${{ steps.check_remaining.outputs.has_more }}
        run: |
          python3 scripts/publish_scan_status.py \
            --status-file /tmp/scan-live/scan-status.json \
            --live-dir /tmp/scan-live \
            --mode finalize \
            --scan-id "$SCAN_ID" \
            --scan-trigger "$SCAN_TRIGGER" \
            --record-novedades "$RECORD_NOVEDADES" \
            --part "2/2" \
            --started-at "$SCAN_STARTED_AT" \
            --antenas-file public/data/antenas.json \
            --job-status "$JOB_STATUS" \
            --has-more "${HAS_MORE:-false}"

  build-and-deploy:
    name: Compilar Aplicación y Preparar Artefacto Pages
    needs: [check-trigger, scan-part-1, scan-part-2]
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && needs.check-trigger.outputs.should_scan != 'true') || needs.scan-part-1.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar último estado del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Ejecutar pruebas automatizadas (Crawler Python + UNICO 5G + CNMC + Frontend Vitest)
        run: |
          python3 -m unittest scripts/test_fetch_antenas.py
          python3 -m unittest scripts/test_build_unico_5g.py
          python3 -m unittest scripts/test_fetch_cnmc_anual.py
          npm test

      - name: Compilar bundle de producción (TypeScript + Vite)
        run: npm run build

      - name: Copiar respaldo 404.html para alojamiento estático
        run: cp dist/index.html dist/404.html

      - name: Configurar entorno GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    name: Publicar en GitHub Pages
    needs: [build-and-deploy]
    if: always() && needs.build-and-deploy.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: 'pages-update-and-deploy'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Esperar propagación del artefacto en la API de GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ATTEMPT in $(seq 1 20); do
            COUNT=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('total_count', 0))" 2>/dev/null || echo 0)
            echo "Intento ${ATTEMPT}/20: artefactos 'github-pages' visibles = ${COUNT}"
            if [ "${COUNT:-0}" -ge 1 ]; then
              break
            fi
            sleep 3
          done

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
