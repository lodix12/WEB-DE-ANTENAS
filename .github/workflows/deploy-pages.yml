name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Compilar Aplicación y Publicar en GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Analizar código con Oxlint
        run: npm run lint

      - name: Ejecutar pruebas del frontend (Vitest)
        run: npm test

      - name: Compilar bundle de producción (TypeScript + Vite)
        run: npm run build

      - name: Copiar respaldo 404.html para alojamiento estático
        run: cp dist/index.html dist/404.html

      - name: Configurar entorno GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
